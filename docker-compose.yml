services:
  db:
    image: postgres:16-alpine
    container_name: consumo-real-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-consumo_real}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-consumo_real}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: consumo-real-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-consumo_real}
      DB_SSLMODE: disable
      DB_TIMEZONE: America/Sao_Paulo
      ADMIN_BASE_NOME: ${ADMIN_BASE_NOME:-Administrador}
      ADMIN_BASE_EMAIL: ${ADMIN_BASE_EMAIL:-admin@consumoreal.com.br}
      ADMIN_BASE_SENHA: ${ADMIN_BASE_SENHA:-admin123}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
